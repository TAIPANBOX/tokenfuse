# cargo-audit configuration.
#
# An ignore here is a claim that an advisory does not reach us, and a claim
# with nothing checking it is how a real exposure gets covered by a decision
# somebody made about a different situation months earlier. So every entry
# below names the reason, and `scripts/audit-ignores.sh` re-establishes that
# reason on every CI run. If the reason stops holding, the script fails and
# the entry has to be argued again rather than quietly protecting nothing.

[advisories]
ignore = [
  # RUSTSEC-2026-0235, rkyv 0.7.46: out-of-bounds reads on archives containing Rc/Arc.
  # Fixed in rkyv 0.8.17. The 0.7 series is no longer supported upstream and gets no fix.
  #
  # Since the rust_decimal 1.43.0 bump in crates/cluster/Cargo.lock (2026-10-19) this entry
  # matches nothing: rust_decimal 1.43.0 no longer depends on rkyv, so rkyv is out of that
  # lockfile (the root lockfile never had it). The entry stays only until the follow-up that
  # removes it, which also re-points the teeth cases that edit it. scripts/audit.sh still
  # asserts that rkyv is absent from the build graph.
  "RUSTSEC-2026-0235",
]
