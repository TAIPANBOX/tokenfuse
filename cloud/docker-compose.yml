# TokenFuse Cloud: the whole stack in one command, after two keys of your own:
#
#   export TOKENFUSE_DEMO_ADMIN_KEY=$(openssl rand -hex 24)
#   export TOKENFUSE_DEMO_INGEST_KEY=$(openssl rand -hex 24)
#   cd cloud && docker compose up
#
# There is no built-in key. The admin key is the one you type into the
# dashboard; the ingest key is the gateway's, and it can push telemetry and read
# like a viewer but cannot kill runs or set budgets (invariant 65). Compose
# refuses to start if either is unset.
#
# Then open the dashboard on http://localhost:3000 (control-plane URL
# http://localhost:8080, org key: your TOKENFUSE_DEMO_ADMIN_KEY) and send
# traffic through the gateway on :4100 - runs and spend show up live. Every
# port is published on 127.0.0.1 only, so the stack is reachable from this
# machine and not from the network it sits on. Runs anywhere Docker runs.
#
#   curl http://localhost:4100/v1/messages \
#     -H 'content-type: application/json' \
#     -H 'x-fuse-run-id: demo-1' -H 'x-fuse-budget-usd: 0.50' \
#     -d '{"model":"claude-sonnet","max_tokens":100,
#          "messages":[{"role":"user","content":"hi"}]}'
#
# The run id is required, not decorative: a call without one is refused with
# 400 metering_required rather than reaching a provider unaccounted for, and it
# is also the id every row on the dashboard is keyed by.
services:
  control-plane:
    image: ghcr.io/taipanbox/tokenfuse-control-plane:latest
    # Or build locally instead of pulling: `docker compose build`
    # build:
    #   context: ..
    #   dockerfile: crates/cloud/Dockerfile
    environment:
      PORT: "8080"
      # The control plane binds 127.0.0.1 unless told otherwise, and inside a
      # container that is the container's own loopback: the gateway on the
      # compose network and the published port below would both find nothing
      # listening. 0.0.0.0 here means every interface of this container, and the
      # port mapping below is what keeps it off the host's network. The plane
      # logs a warning about the wider bind; in this stack that is expected.
      TOKENFUSE_CLOUD_HOST: "0.0.0.0"
      # key:org:role[:site]. Roles are written out rather than left to the
      # default, and the gateway's key is bound to its site.
      TOKENFUSE_CLOUD_KEYS: "${TOKENFUSE_DEMO_ADMIN_KEY:?set TOKENFUSE_DEMO_ADMIN_KEY (see the top of this file)}:demo:admin,${TOKENFUSE_DEMO_INGEST_KEY:?set TOKENFUSE_DEMO_INGEST_KEY (see the top of this file)}:demo:ingest:demo-gateway"
      TOKENFUSE_CLOUD_DATA: "/data/state.json"   # durable across restarts
    volumes:
      - cloud-data:/data
    ports:
      - "127.0.0.1:8080:8080"

  dashboard:
    image: ghcr.io/taipanbox/tokenfuse-dashboard:latest
    # Or build locally: `docker compose build`
    # build: ./dashboard
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - control-plane

  gateway:
    image: ghcr.io/taipanbox/tokenfuse:latest
    environment:
      TOKENFUSE_ADDR: "0.0.0.0:4100"
      # This stack is a demo, so it runs offline against the built-in stub.
      # The stub answers every call itself and meters a fixed 1000 input / 500
      # output tokens, so THE SPEND ON THE DASHBOARD IS INVENTED: it shows the
      # shape of the product, not any real money. The gateway refuses to start
      # with neither variable set, precisely so that nobody gets these numbers
      # by accident. Comment this out and set TOKENFUSE_UPSTREAM to make the
      # figures real; your provider key is passed through per request.
      TOKENFUSE_ALLOW_STUB: "1"
      # TOKENFUSE_UPSTREAM: "https://api.anthropic.com/v1/messages"
      TOKENFUSE_MODE: "enforce"
      TOKENFUSE_CLOUD_URL: "http://control-plane:8080"
      TOKENFUSE_CLOUD_KEY: "${TOKENFUSE_DEMO_INGEST_KEY:?set TOKENFUSE_DEMO_INGEST_KEY (see the top of this file)}"
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      - control-plane

volumes:
  cloud-data:
