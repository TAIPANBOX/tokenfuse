[workspace]
resolver = "2"
members = ["crates/core", "crates/dpop", "crates/delegation", "crates/gateway", "crates/cloud", "crates/tokenfuse"]
# radar is Linux/eBPF-only (its own nested workspace); excluded so the default
# build and macOS/CI stay light. Build it explicitly on Linux — see crates/radar.
exclude = ["crates/radar", "crates/cluster"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TAIPANBOX/tokenfuse"
rust-version = "1.90"

[workspace.dependencies]
tokenfuse-core = { path = "crates/core" }
# RFC 9449 proofs, RFC 7638 thumbprints and the one algorithm allowlist. Small
# on purpose: it exists so the gateway and the cloud can share one verifier
# without either plane depending on the other. See its own module docs.
tokenfuse-dpop = { path = "crates/dpop" }
tokenfuse-delegation = { path = "crates/delegation" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned once here rather than per crate, because two crates in one process
# verifying JWS with two versions of this is how a shared rule stops being
# shared (CLAUDE.md invariant 29).
#
# 10.3.0 is the first release that rejects a string `exp`/`nbf` instead of
# skipping the check (GHSA-h395-gr6q-cpjc). From 10.0.0 the crypto backend is a
# FEATURE and exactly one of `rust_crypto` / `aws_lc_rs` must be on: none or both
# compiles and then panics on first use. `rust_crypto` would pull the `rsa` crate
# (RUSTSEC-2023-0071, no patched release) into every build, so `aws_lc_rs` it is.
# That replaces `ring` as the backend under every JWS verify here: it is a C
# dependency (`aws-lc-sys`) the release workflow's musl legs have not carried
# before, and the RSA bounds invariant 30 reads off `ring` (2048-bit floor,
# 8192-bit ceiling, refused before the exponentiation) have to be re-derived
# against aws-lc-rs. Default features (`use_pem`) are kept.
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
base64 = "0.22"
sha2 = "0.10"

# Debug info is most of what a debug build writes to disk: every test binary
# carried its own full copy of DataFusion's. Line tables keep file:line in
# panics and backtraces; dependencies carry none (invariant 78).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
