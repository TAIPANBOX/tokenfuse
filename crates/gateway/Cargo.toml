[package]
name = "tokenfuse-gateway"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TokenFuse gateway: budget-enforcing proxy between agents and LLM providers."

[[bin]]
name = "tokenfuse"
path = "src/main.rs"

[dependencies]
tokenfuse-core.workspace = true
# RFC 9449 proofs and RFC 7638 thumbprints for the MCP broker's door,
# shared with crates/cloud rather than copied (CLAUDE.md invariant 29).
tokenfuse-dpop.workspace = true
tokenfuse-delegation.workspace = true
thiserror.workspace = true
# Constant-time bearer-key comparison for the observability/kill routes' admin
# gate (crate::adminkeys). Already resolved at 2.6.1 in Cargo.lock as a
# transitive dependency of p256/elliptic-curve, which crates/dpop and
# crates/delegation already pull into this crate's graph; naming it directly
# here adds no new crate to the workspace, only a direct edge to one already
# built.
subtle = "2.6"
# The MCP broker binds a session id it relays to the upstream and the
# credential that opened it (crate::mcpsession, invariant 77). sha2 and
# getrandom are already in Cargo.lock through crates/dpop and crates/cloud.
# hmac 0.12 arrived through p256 0.13's rfc6979 until p256 0.14 (which uses
# hmac 0.13); since then this line is the only edge that keeps hmac 0.12 in
# the lockfile.
hmac = "0.12"
sha2.workspace = true
getrandom = "0.2"
# The checkpoint key (crate::checkpoints, invariant 128): an ES256 key this
# process generates and keeps in memory, signing SPEC 6.5.1 records; base64 for
# keyryx's proof of possession. Both were dev-dependencies for the MCP door's
# tests and are in Cargo.lock through crates/cloud and crates/delegation, so
# nothing new enters the tree.
p256 = { version = "0.14", features = ["ecdsa"] }
base64 = "0.22"
tokio = { workspace = true, features = ["io-std", "io-util"] }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait = "0.1.89"
futures = "0.3.32"
bytes = "1.12.0"
async-stream = "0.3.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "charset"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
datafusion = { version = "55", default-features = false, features = ["parquet", "sql"] }
wasmtime = { version = "49.0.2", optional = true, default-features = false, features = ["cranelift", "runtime", "wat"] }
fastembed = { version = "4", optional = true }
# HA: co-locate a raft node so budgets replicate across gateways. Optional — the
# heavy openraft stack is only pulled in with `--features cluster`. The crate is
# excluded from the default workspace; this path dep builds it on demand.
tokenfuse-cluster = { path = "../cluster", optional = true }

# The raft-backed ledger test stays a binary of its own, outside the crate's
# one integration-test binary (tests/it, invariant 78): it is the target CI's
# `--features cluster --test cluster_backend` step names, and without the
# feature there is nothing in it to build or link.
[[test]]
name = "cluster_backend"
path = "tests/cluster_backend.rs"
required-features = ["cluster"]

[dev-dependencies]
# The minting fixture, so the door tests present a token the ISSUER would mint
# rather than one this repository invented for its own convenience.
tokenfuse-delegation = { workspace = true, features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
cluster = ["dep:tokenfuse-cluster"]
onnx = ["dep:fastembed"]
wasm = ["dep:wasmtime"]
