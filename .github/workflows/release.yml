name: release

# Build and publish the container images to GitHub Container Registry (ghcr.io)
# so TokenFuse runs on any host or cloud with `docker run` / `docker compose`,
# with no dependence on a personal server. Uses the built-in GITHUB_TOKEN.
#
# TWO ARCHITECTURES, BUILT NATIVELY AND THEN MERGED
#
# amd64 and arm64, so the same pinned tag works on a Graviton or Ampere node and
# on an x86 one, and nobody has to know which they got. Until 2026-09-01 this
# workflow had no `platforms:` line at all, so it published amd64 only, and a
# `docker pull` on any arm64 machine answered
#
#     no matching manifest for linux/arm64/v8 in the manifest list entries
#
# The obvious way to add it is `platforms: linux/amd64,linux/arm64` on one
# runner, which builds the foreign architecture under QEMU. For Rust that is
# tens of minutes per image and it is emulating a compiler, which is the worst
# possible thing to emulate.
#
# So each architecture is built on a runner of that architecture, pushed BY
# DIGEST with no tag of its own, and a second job merges the digests into one
# manifest list carrying the tag. Both runners are free for public repositories.
# The shape is Docker's own documented one for exactly this.
#
# Images / tags:
#   ghcr.io/<owner>/tokenfuse                - the gateway (drop-in proxy)
#   ghcr.io/<owner>/tokenfuse:cluster        - the gateway + raft HA (--features cluster)
#   ghcr.io/<owner>/tokenfuse-control-plane  - the Cloud control plane
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # One job per image PER ARCHITECTURE, each on a runner of that architecture.
  # Nothing here carries a tag: a tag on a single-architecture image is what
  # somebody else's arm64 node would then pull and fail on.
  build:
    name: ${{ matrix.name }} on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        image:
          - name: tokenfuse
            repo: tokenfuse
            context: .
            dockerfile: Dockerfile
            build-args: ""
            scope: gateway
          - name: tokenfuse-cluster
            repo: tokenfuse
            context: .
            dockerfile: Dockerfile
            build-args: FEATURES=cluster
            scope: gateway-cluster
          - name: tokenfuse-control-plane
            repo: tokenfuse-control-plane
            context: .
            dockerfile: crates/cloud/Dockerfile
            build-args: ""
            scope: control-plane
          - name: tokenfuse-dashboard
            repo: tokenfuse-dashboard
            context: cloud/dashboard
            dockerfile: cloud/dashboard/Dockerfile
            build-args: ""
            scope: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest and by nothing else. The merge job below is what gives
      # these a name; until it runs they are unreferenced blobs, which is
      # exactly what a half-published release should be.
      # The owner, lowercased, in a step because there is no expression for it.
      #
      # A registry repository name MUST be lowercase and this organisation is
      # TAIPANBOX. That has now broken three separate first releases in one day:
      # costcrew's, the stack-k8s console's, and this one. Each time the fix was
      # applied to the file in front of me rather than as a rule, and each time
      # the next workflow written from the same template had it again.
      #
      # metadata-action lowercases on the way past, which is why the merge job's
      # `images:` line survived while the build job's `outputs:` line did not.
      # Anything talking to buildx directly has to do it itself.
      - name: lowercase the owner
        id: owner
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.build-args }}
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image.repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.scope }}-${{ matrix.arch }}

      # The digest travels to the merge job as a file named after itself, which
      # is how two matrix legs write into one directory without colliding.
      # Does the image's own entrypoint EXECUTE on this architecture. That is
      # the question, and it is not the same as "does it exit 0".
      #
      # A binary built for the wrong architecture does not exit non-zero: the
      # kernel refuses to run it at all and says `exec format error`. Exit codes
      # are ignored here on purpose, because these programs legitimately refuse
      # to start without configuration and one of them exits 1 on `--help`.
      # Requiring success would fail a correct image, and a smoke test that
      # fails on a correct build is one the next person deletes.
      #
      # The image's OWN entrypoint rather than a name written here, so this
      # stays right when a binary is renamed. The gateway's is `tokenfuse` and
      # the control plane's is `tokenfuse-cloud`, which is exactly the kind of
      # difference a hardcoded name gets wrong.
      - name: the entrypoint executes on the architecture that built it
        run: |
          set -eu
          img="ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image.repo }}@${{ steps.build.outputs.digest }}"
          echo "on $(uname -m), image $img"
          out="$(docker run --rm "$img" --version 2>&1 | head -5 || true)"
          case "$out" in
            *"exec format error"*)
              echo "$out"; echo "built for another architecture"; exit 1 ;;
            "")
              out="$(docker run --rm "$img" 2>&1 | head -5 || true)"
              [ -n "$out" ] || { echo "the entrypoint ran and said nothing at all"; exit 1; } ;;
          esac
          printf '%s\n' "$out" | sed 's/^/  /'
          echo "  the entrypoint runs here"

      - name: hand the digest on
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One manifest list per image, naming both architectures under the tag people
  # actually pull. This is the only place a tag is written.
  merge:
    name: merge ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tokenfuse
            repo: tokenfuse
            tags: |
              type=ref,event=tag
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha,format=short
          - name: tokenfuse-cluster
            repo: tokenfuse
            tags: |
              type=raw,value=cluster,enable={{is_default_branch}}
              type=sha,prefix=cluster-,format=short
              type=ref,event=tag,suffix=-cluster
          - name: tokenfuse-control-plane
            repo: tokenfuse-control-plane
            tags: |
              type=ref,event=tag
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha,format=short
          - name: tokenfuse-dashboard
            repo: tokenfuse-dashboard
            tags: |
              type=ref,event=tag
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha,format=short
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action does the tag arithmetic AND lowercases the owner, which
      # is the reason it is still here rather than a plain string: the
      # organisation is TAIPANBOX and a registry repository name must be
      # lowercase. costcrew's first release failed on exactly that.
      # The owner, lowercased, in a step because there is no expression for it.
      #
      # A registry repository name MUST be lowercase and this organisation is
      # TAIPANBOX. That has now broken three separate first releases in one day:
      # costcrew's, the stack-k8s console's, and this one. Each time the fix was
      # applied to the file in front of me rather than as a rule, and each time
      # the next workflow written from the same template had it again.
      #
      # metadata-action lowercases on the way past, which is why the merge job's
      # `images:` line survived while the build job's `outputs:` line did not.
      # Anything talking to buildx directly has to do it itself.
      - name: lowercase the owner
        id: owner
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.repo }}
          flavor: latest=false
          tags: ${{ matrix.tags }}

      - name: create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.repo }}@sha256:%s ' *)

      # Printed rather than assumed. A manifest list with one architecture in it
      # is the failure this whole change is about, and it looks identical to a
      # correct one from the outside.
      - name: say what is in it
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.repo }}:${{ github.ref_name }}"
