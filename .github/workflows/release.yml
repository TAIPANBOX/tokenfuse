name: release

# Build and publish the container images to GitHub Container Registry (ghcr.io)
# so TokenFuse runs on any host or cloud with `docker run` / `docker compose`,
# with no dependence on a personal server. Uses the built-in GITHUB_TOKEN.
#
# TWO ARCHITECTURES, BUILT NATIVELY AND THEN MERGED
#
# amd64 and arm64, so the same pinned tag works on a Graviton or Ampere node and
# on an x86 one, and nobody has to know which they got. Until 2026-09-01 this
# workflow had no `platforms:` line at all, so it published amd64 only, and a
# `docker pull` on any arm64 machine answered
#
#     no matching manifest for linux/arm64/v8 in the manifest list entries
#
# The obvious way to add it is `platforms: linux/amd64,linux/arm64` on one
# runner, which builds the foreign architecture under QEMU. For Rust that is
# tens of minutes per image and it is emulating a compiler, which is the worst
# possible thing to emulate.
#
# So each architecture is built on a runner of that architecture, pushed BY
# DIGEST with no tag of its own, and a second job merges the digests into one
# manifest list carrying the tag. Both runners are free for public repositories.
# The shape is Docker's own documented one for exactly this.
#
# Images / tags:
#   ghcr.io/<owner>/tokenfuse                - the gateway (drop-in proxy)
#   ghcr.io/<owner>/tokenfuse:cluster        - the gateway + raft HA (--features cluster)
#   ghcr.io/<owner>/tokenfuse-control-plane  - the Cloud control plane
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # The binaries job runs on a pull request that changes THIS file, and
  # nothing else does: the two image jobs and the release page stay off (see
  # their `if`), so a pull request builds the four binaries and publishes
  # nothing. Added 2026-09-02 after the first tag that ever exercised the musl
  # step, v0.4.2, failed on both Linux runners with "Unable to locate package
  # musl-tools": the step had been copied from ci.yml without the
  # `apt-get update --snapshot` line, and no run before a tag could have shown
  # it. A workflow that only runs on a tag is tested by the tag, which is the
  # one moment nothing may fail.
  pull_request:
    paths: [".github/workflows/release.yml"]

env:
  # The same archive snapshot ci.yml pins, for the same reason: an unpinned
  # apt step resolves to whatever is newest when the job runs, so the commit
  # that passes today is the commit that fails tomorrow. Bump it deliberately,
  # in a commit that says what moved, the way a lockfile is bumped.
  APT_SNAPSHOT: "20260820T000000Z"

permissions:
  contents: read
  packages: write

jobs:
  # The binaries, before the images, because they are what a person downloads.
  #
  # WHY THIS EXISTS
  #
  # Until 2026-09-01 this workflow published container images and nothing else,
  # so `v0.4.0` carried zero release assets while idryx, qryx, mockryx,
  # agent-conform, the Terraform provider and trailryx all shipped per-platform
  # archives. `docker run` is the intended way in and it works; a release page
  # with nothing on it is still the wrong answer to somebody who wants to try
  # the CLI without a daemon.
  #
  # The shape is trailryx's, which is the estate's proven Rust release. One
  # thing it says about itself does NOT transfer and the difference is the whole
  # risk here: trailryx's core has no third-party crates, and this workspace has
  # `ring` in both binaries plus `zstd-sys` and `snap` in the gateway, which
  # carry C. `musl-tools` is what makes those link statically, and if a musl leg
  # fails that is a finding about this dependency graph rather than a flake.
  # Measured before writing this: `cargo tree -e normal` on both binaries shows
  # no `openssl-sys` and no `aws-lc-sys`, which are the two that usually end
  # this conversation. `wasmtime` and `fastembed` are optional features and are
  # not in a default build.
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl rather than gnu on Linux: a statically linked binary runs on
          # whatever the operator already has, which is the point of shipping
          # one at all.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version

      # The linker the musl targets need. Absent on the runner, and the failure
      # it produces names `cc` rather than musl, which sends people the wrong
      # way.
      - name: musl linker
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          # The snapshot service is served from archive.ubuntu.com; the runner
          # ships pointing at the azure mirror, which does not serve snapshots.
          # Same loop as ci.yml, `if` rather than `[ -f ] &&` for the same
          # reason it gives.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
                   /etc/apt/sources.list.d/*.list; do
            if [ -f "$f" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
            fi
          done
          # Both halves carry --snapshot. The install alone did until
          # 2026-09-02, so apt looked for musl-tools in package lists it had
          # never fetched and answered "Unable to locate package" on every
          # Linux runner of the first tag that ran this job (v0.4.2).
          sudo apt-get update --snapshot "$APT_SNAPSHOT"
          # --snapshot, like bench.yml and ci.yml: unpinned, this resolves to
          # whatever is newest when the job runs, so the commit that passes
          # today is the commit that fails tomorrow. pinned-installs.sh refuses
          # it, and refused this file on its first run.
          sudo apt-get install -y --snapshot "$APT_SNAPSHOT" musl-tools

      # --locked, so the binary on the release page is built from the lockfile
      # in the tag rather than from whatever resolved that morning. Without it a
      # published artifact cannot be rebuilt from its own commit.
      #
      # Default features on purpose: `wasm` and the fastembed leg are opt-in,
      # and a downloadable binary should be the thing the documentation
      # describes rather than a maximal build nobody asked for.
      - name: build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            --bin tokenfuse --bin tokenfuse-cloud

      # Named by target, because a file called `tokenfuse` from four platforms
      # in one directory is four files that overwrite each other.
      - name: name and checksum
        shell: bash
        run: |
          mkdir -p dist
          for bin in tokenfuse tokenfuse-cloud; do
            src="target/${{ matrix.target }}/release/$bin"
            # Not `continue`. Both binaries are asked for on every target here,
            # so a missing one is a build that half worked, and skipping it
            # would publish a release page that is quietly short a platform.
            [ -f "$src" ] || { echo "!! $src was not produced" >&2; exit 1; }
            cp "$src" "dist/$bin-${{ matrix.target }}"
          done
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ./* > "SHA256SUMS-${{ matrix.target }}"
          else
            shasum -a 256 ./* > "SHA256SUMS-${{ matrix.target }}"
          fi
          cat "SHA256SUMS-${{ matrix.target }}"

      # Does it EXECUTE on the architecture that built it. That is the
      # question, and it is not the same as "does it exit 0".
      #
      # The first version of this ran `--version` and required it to return.
      # `crates/gateway/src/main.rs:255` sends an unrecognised argument to
      # `_ => serve().await`, so the binary did the correct thing and started
      # serving, and the job hung until it was cancelled. A smoke test that
      # HANGS is worse than one that fails wrongly: the failure looks like a
      # slow build, and the estate already paid once for a smoke test asking
      # the wrong question when `qryx --help` exited 1 by design.
      #
      # So the run is BOUNDED and a timeout is a pass. A binary that starts
      # serving has executed, which is the whole question. What is not a pass is
      # `exec format error`, which is what the kernel says about a binary built
      # for another architecture, or no output at all.
      #
      # Only on the legs whose architecture the runner shares. A cross-built
      # binary cannot be run here, and pretending otherwise is how a check comes
      # to fail on a correct build.
      - name: it runs on the architecture that built it
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -u
          for bin in tokenfuse tokenfuse-cloud; do
            # Not `timeout`: that is GNU coreutils and the macOS runner does
            # not ship it, so the darwin leg would have failed on a missing
            # command rather than on anything about the binary. Backgrounded,
            # given a moment, then killed, which works the same on both.
            "./dist/$bin-${{ matrix.target }}" --version >/tmp/out.$bin 2>&1 &
            pid=$!
            sleep 10
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            out=$(head -3 "/tmp/out.$bin")
            case "$out" in
              *"exec format error"*)
                echo "  $bin: EXEC FORMAT ERROR, built for another architecture"; exit 1 ;;
              "")
                # Nothing printed and it did not die: it reached its serve loop
                # and the timeout stopped it. That is execution, which is what
                # this asks.
                echo "  $bin: started and was still running at the timeout, so it executes" ;;
              *)
                echo "  $bin: $out" ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: release page
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04  # named, not -latest: a rolling label changes the OS under a tested job
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # One file for every artifact, so a reader checks one thing rather than
      # four. The per-target files stay beside it: somebody verifying a single
      # download should not have to trust that this step concatenated correctly.
      - name: one checksum file
        run: |
          cd dist
          cat SHA256SUMS-* | grep -v '^$' | sed 's#\./##' | sort -k2 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # One job per image PER ARCHITECTURE, each on a runner of that architecture.
  # Nothing here carries a tag: a tag on a single-architecture image is what
  # somebody else's arm64 node would then pull and fail on.
  build:
    name: ${{ matrix.name }} on ${{ matrix.arch }}
    # Never on a pull request: this job pushes by digest, and the merge job
    # below would tag the result by sha, so a pull request would publish.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        image:
          - name: tokenfuse
            repo: tokenfuse
            context: .
            dockerfile: Dockerfile
            build-args: ""
            scope: gateway
          - name: tokenfuse-cluster
            repo: tokenfuse
            context: .
            dockerfile: Dockerfile
            build-args: FEATURES=cluster
            scope: gateway-cluster
          - name: tokenfuse-control-plane
            repo: tokenfuse-control-plane
            context: .
            dockerfile: crates/cloud/Dockerfile
            build-args: ""
            scope: control-plane
          - name: tokenfuse-dashboard
            repo: tokenfuse-dashboard
            context: cloud/dashboard
            dockerfile: cloud/dashboard/Dockerfile
            build-args: ""
            scope: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest and by nothing else. The merge job below is what gives
      # these a name; until it runs they are unreferenced blobs, which is
      # exactly what a half-published release should be.
      # The owner, lowercased, in a step because there is no expression for it.
      #
      # A registry repository name MUST be lowercase and this organisation is
      # TAIPANBOX. That has now broken three separate first releases in one day:
      # costcrew's, the stack-k8s console's, and this one. Each time the fix was
      # applied to the file in front of me rather than as a rule, and each time
      # the next workflow written from the same template had it again.
      #
      # metadata-action lowercases on the way past, which is why the merge job's
      # `images:` line survived while the build job's `outputs:` line did not.
      # Anything talking to buildx directly has to do it itself.
      - name: lowercase the owner
        id: owner
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.build-args }}
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image.repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.scope }}-${{ matrix.arch }}

      # The digest travels to the merge job as a file named after itself, which
      # is how two matrix legs write into one directory without colliding.
      # Does the image's own entrypoint EXECUTE on this architecture. That is
      # the question, and it is not the same as "does it exit 0".
      #
      # A binary built for the wrong architecture does not exit non-zero: the
      # kernel refuses to run it at all and says `exec format error`. Exit codes
      # are ignored here on purpose, because these programs legitimately refuse
      # to start without configuration and one of them exits 1 on `--help`.
      # Requiring success would fail a correct image, and a smoke test that
      # fails on a correct build is one the next person deletes.
      #
      # The image's OWN entrypoint rather than a name written here, so this
      # stays right when a binary is renamed. The gateway's is `tokenfuse` and
      # the control plane's is `tokenfuse-cloud`, which is exactly the kind of
      # difference a hardcoded name gets wrong.
      - name: the entrypoint executes on the architecture that built it
        run: |
          set -eu
          img="ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image.repo }}@${{ steps.build.outputs.digest }}"
          echo "on $(uname -m), image $img"
          out="$(docker run --rm "$img" --version 2>&1 | head -5 || true)"
          case "$out" in
            *"exec format error"*)
              echo "$out"; echo "built for another architecture"; exit 1 ;;
            "")
              out="$(docker run --rm "$img" 2>&1 | head -5 || true)"
              [ -n "$out" ] || { echo "the entrypoint ran and said nothing at all"; exit 1; } ;;
          esac
          printf '%s\n' "$out" | sed 's/^/  /'
          echo "  the entrypoint runs here"

      - name: hand the digest on
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One manifest list per image, naming both architectures under the tag people
  # actually pull. This is the only place a tag is written.
  merge:
    name: merge ${{ matrix.name }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tokenfuse
            repo: tokenfuse
            tags: |
              type=ref,event=tag
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha,format=short
          - name: tokenfuse-cluster
            repo: tokenfuse
            tags: |
              type=raw,value=cluster,enable={{is_default_branch}}
              type=sha,prefix=cluster-,format=short
              type=ref,event=tag,suffix=-cluster
          - name: tokenfuse-control-plane
            repo: tokenfuse-control-plane
            tags: |
              type=ref,event=tag
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha,format=short
          - name: tokenfuse-dashboard
            repo: tokenfuse-dashboard
            tags: |
              type=ref,event=tag
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha,format=short
    steps:
      # TWO EXACT NAMES, NOT A PATTERN, and that is the whole of this fix.
      #
      # `pattern: digest-tokenfuse-*` matched the artifacts of all FOUR images,
      # because `tokenfuse` is a prefix of `tokenfuse-cluster`,
      # `tokenfuse-control-plane` and `tokenfuse-dashboard`. The plain gateway's
      # merge therefore collected eight digests, four of them belonging to other
      # repositories, and answered
      #
      #     ERROR: ghcr.io/taipanbox/tokenfuse@sha256:63f42d...: not found
      #
      # Exactly one job broke: the one whose name is a prefix of the others. The
      # other three globbed cleanly and published, which is why three of four
      # images came out right and the most important one did not.
      #
      # A glob over names that can be prefixes of each other is the same trap
      # `scripts/manifest-is-true.sh` in stack-k8s already carries a note about,
      # where `- name: focus-export` matched `focus-exporter`. There are exactly
      # two architectures, so there is nothing here a pattern buys.
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.name }}-amd64
          path: /tmp/digests
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.name }}-arm64
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action does the tag arithmetic AND lowercases the owner, which
      # is the reason it is still here rather than a plain string: the
      # organisation is TAIPANBOX and a registry repository name must be
      # lowercase. costcrew's first release failed on exactly that.
      # The owner, lowercased, in a step because there is no expression for it.
      #
      # A registry repository name MUST be lowercase and this organisation is
      # TAIPANBOX. That has now broken three separate first releases in one day:
      # costcrew's, the stack-k8s console's, and this one. Each time the fix was
      # applied to the file in front of me rather than as a rule, and each time
      # the next workflow written from the same template had it again.
      #
      # metadata-action lowercases on the way past, which is why the merge job's
      # `images:` line survived while the build job's `outputs:` line did not.
      # Anything talking to buildx directly has to do it itself.
      - name: lowercase the owner
        id: owner
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.repo }}
          flavor: latest=false
          tags: ${{ matrix.tags }}

      - name: create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.repo }}@sha256:%s ' *)

      # Printed rather than assumed. A manifest list with one architecture in it
      # is the failure this whole change is about, and it looks identical to a
      # correct one from the outside.
      # The tag this job actually created, not the git ref. They are the same
      # for three of these four and not for the cluster variant, whose tag
      # carries a `-cluster` suffix, so this step looked up a tag a DIFFERENT
      # job was responsible for and failed on a merge that had worked.
      - name: say what is in it
        run: |
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "created $tag"
          docker buildx imagetools inspect "$tag"
