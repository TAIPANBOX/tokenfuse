name: publish sdks

# Manual publish of the two SDK packages that npm-publish.yml does not cover:
# `tokenfuse-sdk` on PyPI (sdk/python) and the `tokenfuse` umbrella crate on
# crates.io (crates/tokenfuse). Both version with the gateway from 0.5.0
# (decision 10.20 (a), 2026-09-12): bump them in the same pull request as the
# tag, then run this once per tag.
#
# PyPI: trusted publishing, no stored token. Configure once at
#   https://pypi.org/manage/project/tokenfuse-sdk/settings/publishing/
# with owner TAIPANBOX, repository tokenfuse, workflow sdk-publish.yml,
# environment pypi. Until that exists the pypi job fails at the publish step
# and publishes nothing, which is the honest outcome of running it too early.
#
# crates.io: a token is the only mechanism. Put it in a repository secret named
# exactly CARGO_REGISTRY_TOKEN (crates.io -> Account Settings -> API Tokens,
# scope publish-update, crate tokenfuse). The job checks the secret is present
# and says so rather than failing inside cargo.
#
# Both jobs are workflow_dispatch only: a tag must not publish a package whose
# registry side nobody configured yet.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: build + publish tokenfuse-sdk to PyPI
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tokenfuse-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test
        working-directory: sdk/python
        run: |
          pip install pytest==9.1.1 build==1.3.0
          python -m pytest -q
      - name: Build sdist and wheel
        working-directory: sdk/python
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist/

  crate:
    name: publish the tokenfuse umbrella crate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the token must exist, or say so
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set: crates.io publishing is not configured; nothing published." >&2
            exit 1
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p tokenfuse --locked
