name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # One archive snapshot for every apt step in this file. Bump it deliberately,
  # in a commit that says what moved and why, the way a lockfile is bumped.
  APT_SNAPSHOT: "20260820T000000Z"
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 pulls tags along with full history. Without it,
      # actions/checkout fetches no tags at all, and stated-numbers.sh's
      # version-badge check (below) would see no v* tag and correctly refuse
      # with "measured nothing" rather than silently passing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Free runner disk
        # This job builds three full profiles (clippy --all-features, debug
        # tests, and the cluster-feature test graph); with a warm cache the
        # 14 GB runner disk runs dry mid-link (ld dies with SIGBUS). Drop the
        # preinstalled bundles we never use (~25 GB) instead of a third-party
        # cleanup action.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # v1: fresh namespace after the 2026-07-09 poisoned-cache SIGBUS;
          # bump to invalidate if link-time disk pressure recurs.
          prefix-key: v1
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all
      - name: Test (cluster feature, raft-backed ledger)
        run: cargo test -p tokenfuse-gateway --features cluster --test cluster_backend
      - name: tokenfuse-core stays dependency-minimal
        run: ./scripts/core-deps.sh

      # Invariant 1 keeps utoipa out of core, which makes the compiler refuse
      # most ways a core type could reach the Cloud OpenAPI. The one way it does
      # not refuse is #[schema(value_type = ..)], and two fields already use it.
      - name: core types stay behind the Cloud DTO boundary
        run: ./scripts/dto-boundary.sh

      # A field added to the replicated ledger compiles and passes every test,
      # because every test builds a fresh state machine. A node with a durable
      # store cannot read back what it wrote under the old shape, and comes up
      # having lost every budget with no error. This makes that a decision.
      - name: the replicated ledger keeps its recorded shape
        run: ./scripts/replicated-shape.sh

      # Invariant 4's two halves that have a mechanical form: a control's grade
      # in the compliance catalog is a claim made to a regulator, and moving one
      # up is a one-word edit nothing else would notice; and the limitations the
      # docs must state plainly can be checked for presence, since a missing
      # sentence is as checkable as a present one.
      - name: claims about coverage stay recorded
        run: ./scripts/honest-claims.sh

      # The wire strings, severities, trace columns and prices other
      # repositories read out of this one used to be retyped by hand at the far
      # end. verdryx's blocked-decision mirror carried seven of nine for eleven
      # days that way. contracts/tokenfuse-constants.json is generated from the
      # Rust instead, and this is what keeps "generated" true after the commit
      # that generated it.
      - name: the published stack constants match the Rust
        run: ./scripts/constants.sh


      # A number in a document is a claim with no owner. The it-rat.com page for
      # this service said 513 tests while the workspace ran 709, and nobody
      # knows for how long. It was not wrong when written; nothing was
      # watching it. This is that check at the source.
      #
      # It covers PROGRESS.md as well as the README, because gating only the
      # badge left the same figure in prose one file over saying 100 where the
      # workspace ran 747, and reading is what caught it rather than any check.
      - name: the numbers this repo states about itself are true
        run: ./scripts/stated-numbers.sh

      # An unpinned install is a dependency with no lockfile. `cargo install
      # bpf-linker` took main red on 2026-08-20 without a commit: 0.11.0 was
      # published the day after that job last passed, and the first pull
      # request opened afterwards wore the red check. Every job here installs
      # tools by name, so the check that they are pinned runs once, over all
      # the workflow files, rather than once per job.
      - name: every tool CI installs is pinned
        run: ./scripts/pinned-installs.sh

  python-sdk:
    name: python sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest==9.1.1
      - name: Test
        working-directory: sdk/python
        run: python -m pytest -q

  js-sdk:
    name: js sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test
        working-directory: sdk/js
        run: node test.js

  openapi:
    name: openapi spec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate spec
        run: cargo run -q -p tokenfuse-cloud -- --openapi > openapi.json
      - name: Validate spec
        run: |
          pip install openapi-spec-validator==0.9.0
          openapi-spec-validator openapi.json
      - name: Upload spec artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: openapi.json

  # The Cloud control plane is now a Rust workspace member (crates/cloud); it is
  # built, clippy-checked and tested by the `fmt · clippy · test` job above. The
  # former Go `cloud` job was removed in the Go→Rust port (ADR-7, PR A5).

  dashboard:
    name: dashboard (Next.js)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/dashboard/package-lock.json
      - name: Install
        working-directory: cloud/dashboard
        run: npm ci --no-audit --no-fund
      - name: Build (static export)
        working-directory: cloud/dashboard
        run: npm run build

  cluster:
    name: cluster (raft HA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/cluster
      - name: Format check
        working-directory: crates/cluster
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: crates/cluster
        run: cargo clippy --all-targets
      - name: Test
        working-directory: crates/cluster
        run: cargo test

  security:
    name: security (cargo audit)
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 here too: this job runs gates-have-teeth.sh, whose
      # stated-numbers cases call the version-badge check, and a checkout
      # with no tags makes that check refuse on a clean tree, so every one
      # of those cases would read UNJUDGEABLE rather than judging the fault.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      # Both lockfiles, one ignore list, and a check that each ignore's reason
      # still holds. Two bare `cargo audit` calls needed the list in two
      # places, because cargo-audit reads `.cargo/audit.toml` from the current
      # directory and does not walk up.
      - name: Audit both lockfiles
        run: ./scripts/audit.sh

      # The gates parse text with regular expressions, which does not break
      # loudly: a parser stops matching and reports success. This breaks each
      # of them on purpose and requires the failure.
      #
      # It lives in THIS job rather than beside the other gates, and the reason
      # is cargo-audit: it exercises every gate in scripts/, audit.sh among
      # them, and that one needs a tool only this job installs. Run anywhere
      # else it reports three cases UNJUDGEABLE, correctly, because a gate that
      # cannot run is not a gate that passed. That is how this was found.
      #
      # It mutates tracked files and restores them, so it goes last, and it
      # needs a clean tree and says so plainly, which also reports any earlier
      # step that starts writing into the checkout.
      - name: the gates still fail on the faults they exist to catch
        run: ./scripts/gates-have-teeth.sh

  # Decides whether the radar job below has anything to test. radar is its own
  # nested workspace with no path dependency on the rest of the repository, so
  # a change outside crates/radar, this file and the apt probe cannot change
  # what it builds. Until 2026-09-08 the job ran on every pull request anyway,
  # and on that day snapshot.ubuntu.com was down for hours: every open pull
  # request, most of them touching docs, the dashboard or an SDK, wore a red
  # `radar (eBPF build)` for an outage none of them could cause or fix. The
  # job stays a required check; when it is skipped here it reports "skipped",
  # which branch protection counts as satisfied, and the reason is in this
  # job's summary rather than implied by a green tick.
  #
  # Decided against, and why: a `paths:` filter on the workflow (a required
  # check that never reports blocks the merge instead of skipping), a
  # third-party paths-filter action (one more pinned dependency for four
  # lines of git), and any live-archive fallback for the snapshot itself
  # (@yurii 2026-09-08: that trade is closed; the pin stays).
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    outputs:
      radar: ${{ steps.radar.outputs.radar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: radar-relevant paths in this change
        id: radar
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Any doubt runs the job: a base we cannot diff against (a first push,
          # a force-push, a shallow clone) is a reason to run, never to skip.
          relevant=true; reason="could not diff against base '$BASE'; running to be safe"
          if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -Eq '^0+$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if files=$(git diff --name-only "$BASE" "$GITHUB_SHA"); then
              if printf '%s\n' "$files" | grep -Eq '^(crates/radar/|\.github/workflows/ci\.yml$|scripts/apt-snapshot-probe\.sh$)'; then
                relevant=true; reason="radar, this workflow or the apt probe changed"
              else
                relevant=false; reason="nothing under crates/radar, this workflow or the apt probe changed ($(printf '%s\n' "$files" | grep -c .) file(s) elsewhere)"
              fi
            fi
          fi
          echo "radar=$relevant" >>"$GITHUB_OUTPUT"
          echo "radar (eBPF build): $([ "$relevant" = true ] && echo runs || echo skipped), $reason" | tee -a "$GITHUB_STEP_SUMMARY"

  radar:
    name: radar (eBPF build)
    needs: changes
    if: needs.changes.outputs.radar == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps
        # A hard ceiling for a flapping snapshot service; the probe catches
        # "down", apt's per-fetch bounds do not add up to a bound on the step.
        timeout-minutes: 6
        run: |
          # The snapshot service is served from archive.ubuntu.com. The runner
          # ships pointing at the azure mirror, which does not serve snapshots
          # and has its own long record of missing content.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
                   /etc/apt/sources.list.d/*.list; do
            # `if`, not `[ -f ] &&`: GitHub runs these blocks under `bash -e`, and a
            # glob that matches nothing makes the && list exit 1 and kill the step.
            if [ -f "$f" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
            fi
          done
          ./scripts/apt-snapshot-probe.sh
          sudo apt-get update --snapshot "$APT_SNAPSHOT"
          sudo apt-get install -y --snapshot "$APT_SNAPSHOT" clang llvm libelf-dev
      - name: Install Rust (stable + nightly + rust-src)
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly
          components: rust-src
      - run: rustup toolchain install stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/radar
      # Pinned, and the pin is the point. This step read `cargo install
      # bpf-linker` until 2026-08-20, which resolves to whatever is newest at
      # the moment the job runs. bpf-linker 0.11.0 was published on 2026-08-12,
      # the day after the last green run of this job, and it links against
      # system LLVM dynamically: the step then died with `rust-lld: error:
      # unable to find library -lLLVM`, because `System deps` above installs
      # `llvm` and not `llvm-dev`. Nothing in this repository had changed, and
      # main went red on its own.
      #
      # 0.10.4 is the last 0.10.x and ships its own Cargo.lock, so `--locked`
      # holds bpf-linker's transitive dependencies too and not only its
      # version. Moving to 0.11.0 is a separate decision and needs the LLVM
      # dev package chosen deliberately rather than inherited from whatever
      # the runner image happens to carry, which is the coupling that broke
      # this in the first place.
      - name: Install bpf-linker
        run: cargo install bpf-linker --version 0.10.4 --locked
      - name: Build radar
        working-directory: crates/radar
        run: cargo build
      # The userspace crate only: radar-ebpf is `no_std`/`no_main` and has
      # nothing to run. Added with the first tests this crate ever had; until
      # 2026-08-08 the job built and stopped, so a test placed here would have
      # been compiled by nobody and run by nobody while reading as coverage.
      - name: Test radar (userspace)
        working-directory: crates/radar
        run: cargo test -p radar

  apns:
    name: cloud apns (feature build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build + clippy the real APNs sender
        run: cargo clippy -p tokenfuse-cloud --all-targets --features apns -- -D warnings

