[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenfuse-sdk"
version = "1.20.0"
description = "Python SDK for TokenFuse — runtime cost control for AI agents (import as `tokenfuse`)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Yurii Kostiuk" }]
keywords = ["llm", "agents", "finops", "budget", "tokenfuse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/TAIPANBOX/tokenfuse"
Repository = "https://github.com/TAIPANBOX/tokenfuse"
Issues = "https://github.com/TAIPANBOX/tokenfuse/issues"

# The base package stays dependency-free. The agent token helper (tokenfuse.agent)
# needs httpx for httpx.Auth and cryptography for the ES256 signature:
#   pip install "tokenfuse-sdk[agent]"
[project.optional-dependencies]
agent = ["httpx>=0.28.1", "cryptography>=46.0.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenfuse*"]

[tool.pytest.ini_options]
pythonpath = ["."]
